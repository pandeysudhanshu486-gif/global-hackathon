# WorkProof AI - Production Render Blueprint
# Infrastructure as Code specification for WorkProof AI services
version: "1"

services:
  # 1. WorkProof AI Core API Service (Public Web Service)
  - type: web
    name: workproof-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false # Set to your deployed Vercel frontend URL, e.g. https://workproof-ai.vercel.app
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string: mongodb+srv://...
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: EXECUTION_SECRET
        generateValue: true
      - key: EXECUTION_SERVICE_URL
        value: http://workproof-execution-service:5003
      - key: GEMINI_API_KEY
        sync: false # Optional: Google Gemini API Key for dynamic skill gap suggestions
      - key: GITHUB_TOKEN
        sync: false # Optional: GitHub Personal Access Token for higher rate limits

  # 2. WorkProof AI Isolated Execution Boundary (Private Service)
  # IMPORTANT: This service is NOT directly accessible from the public internet.
  # It is isolated inside Render's private network and requires internal x-execution-secret verification.
  - type: pserv
    name: workproof-execution-service
    runtime: node
    plan: free
    region: oregon
    rootDir: execution-service
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5003
      - key: EXECUTION_SECRET
        fromService:
          type: web
          name: workproof-backend
          envVarKey: EXECUTION_SECRET
